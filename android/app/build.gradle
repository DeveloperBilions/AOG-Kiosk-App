plugins {
    id 'com.android.application'
}

// Load release signing creds from android/keystore.properties (gitignored).
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.thebilions.aogkiosk'
    compileSdk 34

    defaultConfig {
        applicationId "com.thebilions.aogkiosk"
        minSdk 21          // Android 5.0 — covers virtually all Android TV boxes
        targetSdk 34
        versionCode 4
        versionName "1.3"

        // ---- Kiosk configuration (change here, rebuild) ----------------------
        // The hosted page the kiosk loads. Update content by editing the page in
        // web/ and pushing — every TV auto-refreshes; no reinstall needed.
        buildConfigField "String", "KIOSK_URL", "\"https://developerbilions.github.io/AOG-Kiosk-App/\""
        // How often (ms) the TV silently reloads the hosted page. 15 minutes.
        buildConfigField "long", "REFRESH_INTERVAL_MS", "${15L * 60L * 1000L}L"
        // ---------------------------------------------------------------------
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // Explicitly enable APK Signature Schemes v1, v2 and v3 so the
                // package installs on every Android TV (some reject v1-only or
                // v2-less APKs). v1 also keeps pre-API-24 installs working.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sign with the release key when keystore.properties is present;
            // otherwise the release build stays unsigned (CI without secrets).
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
